name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # 避开整 5/10 分钟的 Actions 高峰；客户端会在漏跑超过 18 分钟时实时补刷。
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .index-cache
          key: flow-index-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            flow-index-${{ runner.os }}-
      - name: Restore last published index
        continue-on-error: true
        run: |
          curl -fsSL --retry 2 https://earnbabysol.github.io/uniswap-lp-tool/index/flow.json -o public/index/flow.json
          curl -fsSL --retry 2 https://earnbabysol.github.io/uniswap-lp-tool/index/pools.json -o public/index/pools.json
      - name: Refresh shared LP index
        timeout-minutes: 7
        run: npm run index:flow
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
